  <title id="titulo">Acción-Reacción</title><desc id="descripcion">Pizarra de media pista. Coordenadas de 0 a 100 desde la esquina superior izquierda de cada pista. 1. Pase entre filas: Pase por 35, 59 a 65, 59; Pase por 65, 65 a 35, 65; Atacante 1 en 35, 62; Balón en 39, 60; Atacante 2 en 65, 62; Atacante 3 en 35, 75; Atacante 4 en 65, 75; Entrenador en 85, 48; Texto «Señal secreta» en 83, 38. 2. La señal decide · 1c1: Bote por 35, 62 a 38, 43 a 46, 24; Movimiento por 65, 62 a 56, 46 a 51, 29; Tiro por 46, 24 a 50, 8; Atacante 1 en 35, 62; Balón en 39, 60; Defensor en 65, 62; Entrenador en 85, 48; Texto «Ejemplo: 1 ataca, 2 defiende» en 50, 84.</desc>
