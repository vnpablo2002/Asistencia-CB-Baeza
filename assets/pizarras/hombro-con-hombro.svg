  <title id="titulo">1c1 hombro con hombro</title><desc id="descripcion">Pizarra de media pista. Coordenadas de 0 a 100 desde la esquina superior izquierda de cada pista. 1. Filas juntas en medio campo: Atacante 1 en 68, 79; Balón en 73, 79; Defensor en 56, 79; Atacante 2 en 68, 90; Defensor en 56, 90; Texto «Fuera: ataque · dentro: defensa» en 11, 56; Texto «Salen juntos hacia el aro» en 11, 65. 2. Carrera y 1c1: Bote por 68, 79 a 63, 53 a 56, 25; Movimiento por 56, 79 a 54, 59 a 59, 42; Tiro por 56, 25 a 50, 8; Atacante 1 en 68, 79; Balón en 73, 79; Defensor en 56, 79; Texto «Defensa: correr para ponerse delante» en 7, 45; Texto «Sin choques; cambiar de fila al terminar» en 8, 93.</desc>
