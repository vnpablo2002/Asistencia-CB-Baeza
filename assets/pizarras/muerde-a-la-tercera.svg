  <title id="titulo">Muerde a la tercera</title><desc id="descripcion">Pizarra de media pista. Coordenadas de 0 a 100 desde la esquina superior izquierda de cada pista. 1. Dos fintas con bote vivo: Atacante 1 en 50, 68; Balón en 56, 68; Defensor en 50, 43; Texto «Fintas 1 y 2» en 13, 79; Texto «Manos atrás» en 14, 30. 2. Tercera finta y salida: Movimiento por 50, 43 a 40, 50; Bote por 50, 68 a 61, 58 a 67, 40 a 67, 28; Atacante 1 en 50, 68; Balón en 56, 68; Defensor en 50, 43; Texto «A la tercera, el defensor pica» en 12, 78; Texto «Salir por el lado libre: máximo 3 botes» en 17, 87.</desc>
