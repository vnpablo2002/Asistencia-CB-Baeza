  <title id="titulo">1x1 en cuadrante</title><desc id="descripcion">Pizarra de media pista. Coordenadas de 0 a 100 desde la esquina superior izquierda de cada pista. 1. Parejas: pase del defensor: Límite por 50, 15 a 50, 96; Pase por 27, 39 a 27, 67; Pase por 73, 39 a 73, 67; Cono en 50, 15; Cono en 50, 96; Defensor en 27, 39; Balón en 31, 39; Atacante 1 en 27, 67; Defensor en 73, 39; Balón en 77, 39; Atacante 2 en 73, 67; Texto «Una pareja y un balón por cuadrante» en 50, 86. 2. Salir en menos de 3 segundos: Límite por 50, 15 a 50, 96; Bote por 27, 67 a 18, 55 a 20, 35 a 39, 17; Bote por 73, 67 a 82, 55 a 80, 35 a 61, 17; Cono en 50, 15; Cono en 50, 96; Atacante 1 en 27, 67; Balón en 23, 66; Defensor en 27, 45; Atacante 2 en 73, 67; Balón en 77, 66; Defensor en 73, 45; Texto «Sin salir del cuadrante · llevar marcador» en 50, 86.</desc>
