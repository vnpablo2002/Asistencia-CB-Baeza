  <title id="titulo">Gánate los botes</title><desc id="descripcion">Pizarra de media pista. Coordenadas de 0 a 100 desde la esquina superior izquierda de cada pista. 1. Del fondo al tiro libre: Bote por 45, 20 a 40, 29 a 51, 37 a 47, 50; Atacante 1 en 45, 20; Balón en 51, 20; Defensor en 48, 34; Atacante 2 en 80, 77; Defensor en 90, 77; Texto «Dentro de la zona · contar giros» en 5, 58; Texto «Resto espera en fila» en 8, 87. 2. Cambian papeles y atacan: Bote por 45, 52 a 43, 39 a 47, 27; Tiro por 47, 27 a 50, 8; Atacante 2 en 45, 52; Balón en 39, 52; Defensor en 53, 42; Texto «Quien defendía ataca: un bote por giro» en 7, 70; Texto «Cero giros: tirar sin botar» en 7, 79.</desc>
