  <title id="titulo">Lee la mano</title><desc id="descripcion">Pizarra de media pista. Coordenadas de 0 a 100 desde la esquina superior izquierda de cada pista. 1. Mano baja: cambio alto: Bote por 50, 76 a 50, 61 a 60, 53 a 63, 39; Movimiento por 63, 39 a 70, 49 a 68, 70; Atacante 1 en 50, 76; Balón en 56, 76; Defensor en 50, 45; Texto «Mano baja → cambio alto» en 9, 31; Texto «1–2 botes; pasar, girar y volver» en 9, 91. 2. Mano alta: cambio bajo: Bote por 50, 76 a 50, 61 a 40, 53 a 37, 39; Movimiento por 37, 39 a 30, 49 a 32, 70; Atacante 1 en 50, 76; Balón en 56, 76; Defensor en 50, 45; Texto «Mano alta → cambio bajo» en 9, 31; Texto «Cambiar roles cada 10 repeticiones» en 9, 91.</desc>
