  <title id="titulo">Rebote cara a cara + 1c1</title><desc id="descripcion">Pizarra de pista completa. Coordenadas de 0 a 100 desde la esquina superior izquierda de cada pista. 1. Tiro y rebote cara a cara: Tiro por 78, 20 a 50, 5; Movimiento por 42, 16 a 47, 9; Movimiento por 58, 16 a 53, 9; Entrenador en 78, 20; Balón en 74, 18; Atacante 1 en 42, 16; Atacante 2 en 58, 16; Texto «Poste bajo · luchar el rebote» en 50, 30. 2. Quien rebotea ataca el otro aro: Bote por 42, 16 a 35, 35 a 39, 64 a 48, 88; Movimiento por 58, 16 a 56, 38 a 54, 65 a 53, 84; Tiro por 48, 88 a 50, 95; Atacante 1 en 42, 16; Balón en 38, 16; Defensor en 58, 16; Texto «Ejemplo: 1 rebotea · 2 defiende» en 50, 51.</desc>
