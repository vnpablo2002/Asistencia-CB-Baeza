  <title id="titulo">Retrocede y ataca</title><desc id="descripcion">Pizarra de media pista. Coordenadas de 0 a 100 desde la esquina superior izquierda de cada pista. 1. Avanzar y recibir presión: Límite por 34, 18 a 34, 89; Límite por 66, 18 a 66, 89; Límite por 34, 18 a 66, 18; Cono en 34, 18; Cono en 66, 18; Cono en 34, 89; Cono en 66, 89; Bote por 48, 82 a 48, 65; Movimiento por 50, 43 a 50, 54; Atacante 1 en 48, 82; Balón en 54, 82; Defensor en 50, 43; Texto «Meta» en 70, 18; Texto «Pasillo de unos 4 m» en 5, 96. 2. Dos botes atrás y cambio: Límite por 34, 18 a 34, 89; Límite por 66, 18 a 66, 89; Límite por 34, 18 a 66, 18; Cono en 34, 18; Cono en 66, 18; Cono en 34, 89; Cono en 66, 89; Bote por 46, 60 a 45, 69 a 46, 78 a 57, 76; Atacante 1 en 46, 60; Balón en 40, 62; Defensor en 50, 47; Texto «Proteger sin dar la espalda» en 5, 96. 3. Atacar y cruzar botando: Límite por 34, 18 a 34, 89; Límite por 66, 18 a 66, 89; Límite por 34, 18 a 66, 18; Cono en 34, 18; Cono en 66, 18; Cono en 34, 89; Cono en 66, 89; Bote por 57, 76 a 60, 55 a 60, 34 a 58, 14; Atacante 1 en 57, 76; Balón en 63, 76; Defensor en 46, 47; Texto «Fuera o balón tocado: punto defensa» en 4, 96.</desc>
