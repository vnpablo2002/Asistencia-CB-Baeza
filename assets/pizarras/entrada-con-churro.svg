  <title id="titulo">Entrada con churro</title><desc id="descripcion">Pizarra de media pista. Coordenadas de 0 a 100 desde la esquina superior izquierda de cada pista. 1. Salida de la fila: Bote por 75, 76 a 70, 57 a 61, 40; Atacante 1 en 75, 76; Balón en 80, 76; Atacante 2 en 82, 87; Atacante 3 en 88, 95; Defensor en 42, 31; Texto «Churro» en 17, 41. 2. Contacto y entrada: Movimiento por 42, 33 a 50, 29; Tiro por 60, 31 a 50, 8; Atacante 1 en 60, 31; Balón en 65, 30; Defensor en 42, 33; Texto «Churro suave: hombro o brazo» en 12, 53; Texto «Sin piernas ni contacto por detrás» en 15, 62.</desc>
