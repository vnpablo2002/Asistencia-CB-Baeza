<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1432" viewBox="0 0 1200 1432" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Get Open 1c1+1</title><desc id="descripcion">Pizarra de media pista. Coordenadas de 0 a 100 desde la esquina superior izquierda de cada pista. 1. Desmarque y lectura: Movimiento por 72, 56 a 77, 47 a 66, 40; Atacante 1 en 30, 65; Balón en 34, 63; Texto «Apoyo» en 30, 76; Atacante 2 en 72, 56; Defensor en 65, 50; Texto «Ganar la recepción» en 72, 69. 2. Si niega: puerta atrás: Movimiento por 72, 51 a 66, 38 a 53, 20; Pase por 32, 62 a 53, 20; Tiro por 53, 20 a 50, 8; Atacante 1 en 32, 62; Balón en 36, 60; Atacante 2 en 72, 51; Defensor en 64, 55; Texto «Defensor niega» en 70, 70. 3. Si no niega: entrega en mano: Movimiento por 74, 62 a 54, 62 a 42, 62; Bote por 42, 62 a 53, 48 a 58, 30 a 53, 20; Tiro por 53, 20 a 50, 8; Atacante 1 en 30, 62; Balón en 35, 62; Atacante 2 en 74, 62; Defensor en 70, 48; Texto «Apoyo: entrega en mano» en 30, 73; Texto «2 va al balón y juega 1c1» en 70, 80.</desc>
