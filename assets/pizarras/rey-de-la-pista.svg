  <title id="titulo">Rey de la pista</title><desc id="descripcion">Pizarra de media pista. Coordenadas de 0 a 100 desde la esquina superior izquierda de cada pista. 1. 1c1 · máximo 3 botes: Bote por 50, 66 a 39, 52 a 43, 28; Tiro por 43, 28 a 50, 8; Atacante 1 en 50, 66; Balón en 54, 65; Defensor en 50, 50; Atacante 2 en 83, 72; Atacante 3 en 83, 82; Texto «Fila · 3–6» en 83, 92. 2. Canasta o parada: Atacante 1 en 29, 51; Balón en 33, 50; Defensor en 29, 35; Texto «Canasta: +1, sigue» en 29, 69; Texto «Defensor a la fila» en 29, 78; Atacante 2 en 73, 51; Balón en 77, 50; Texto «Parada: defensor ataca» en 73, 69; Texto «Atacante a la fila» en 73, 78; Texto «Gana quien llega a la puntuación acordada» en 50, 92.</desc>
